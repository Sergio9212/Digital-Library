version: '3.9'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqldata
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourPassword123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  webapi:
    build: ./DigitalLibrary.API
    depends_on:
      sqlserver:
        condition: service_healthy
      mongodb:
        condition: service_started
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=DigitalLibraryDb;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True;
      - MongoSettings__ConnectionString=mongodb://digitallibrary:digitallibrary@mongodb:27017
      - MongoSettings__DatabaseName=DigitalLibraryGraphQL
    networks:
      - app_network

  frontend:
    build: ./DigitalLibrary.Frontend
    ports:
      - "3000:3000"
    depends_on:
      - webapi
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_GRAPHQL_URL=http://localhost:5000/graphql
    networks:
      - app_network

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=digitallibrary
      - MONGO_INITDB_ROOT_PASSWORD=digitallibrary
      - MONGO_INITDB_DATABASE=DigitalLibraryGraphQL
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network

  mongo-express:
    image: mongo-express:1.0.0-alpha.4
    container_name: mongoexpress
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=digitallibrary
      - ME_CONFIG_MONGODB_ADMINPASSWORD=digitallibrary
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    depends_on:
      - mongodb
    networks:
      - app_network

networks:
  app_network:

volumes:
  sql_data:
  mongo_data:
